<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>Wedding Solar Counter</title>

  <meta name="description" content="Solar rotations until our wedding">
  <meta property="og:title" content="Wedding Solar Counter">
  <meta property="og:description" content="Solar rotations until our wedding">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://grand-hummingbird-b8a51f.netlify.app/">
  <meta property="og:image" content="https://grand-hummingbird-b8a51f.netlify.app/test01.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: Georgia, serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .counter {
      text-align: center;
    }

    .value {
      font-size: 80px;
      color: #d4a017;
      font-weight: bold;
    }

    .label {
      font-size: 30px;
      color: #333;
    }
  </style>
</head>

<body>
  <div class="counter">
    <div class="value" id="solar"></div>

    <div class="label">
      Carrington Rotations Until Our Wedding
    </div>
  </div>

  <script>
    const weddingDate = new Date("2026-08-15T15:00:00");
    const solarRotation = 27.2753;

    function updateCounter() {
      const now = new Date();

      const daysRemaining =
        (weddingDate - now) / (1000 * 60 * 60 * 24);

      const rotations =
        daysRemaining / solarRotation;

      document.getElementById("solar").innerHTML =
        "☀ " + Math.max(rotations, 0).toFixed(6);
    }

    updateCounter();
    setInterval(updateCounter, 1000);
  </script>
</body>
</html>
